[package]
name = "own-commander-agent"
version = "0.7.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.32"
sha2 = "0.10"
hex = "0.4"
